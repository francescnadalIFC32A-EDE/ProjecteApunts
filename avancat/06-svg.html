    <h1>SVG (ampliació)</h1>
<p>SVG és un format de gràfics vectorials que es pot ampliar sense perdre qualitat. S'utilitza per a icones, logotips i dibuixos.</p>
<p>Exemple:</p>
<pre><code>&lt;svg width="100" height="100"&gt;
    &lt;circle cx="50" cy="50" r="40" fill="blue" /&gt;
&lt;/svg&gt;</code></pre>
