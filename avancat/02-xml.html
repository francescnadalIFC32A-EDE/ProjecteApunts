    <h1>XML</h1>
<p>XML és un llenguatge de marques que permet guardar i organitzar dades amb etiquetes pròpies.</p>
<p>Exemple:</p>
<pre><code>&lt;llibre&gt;
    &lt;titol&gt;El meu llibre&lt;/titol&gt;
    &lt;autor&gt;Anna&lt;/autor&gt;
&lt;/llibre&gt;</code></pre>
