    <h1>HTTP</h1>
<p>HTTP és un protocol que permet que el navegador i el servidor es comuniquin per carregar pàgines i altres recursos web.</p>
<ul>
    <li><strong>GET:</strong> demana informació.</li>
    <li><strong>POST:</strong> envia informació.</li>
    <li><strong>404:</strong> el recurs no s'ha trobat.</li>
</ul>
