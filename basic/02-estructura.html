    <h1>Estructura bàsica d'un document HTML</h1>
<p>Un document HTML té una estructura jeràrquica d'<strong>etiquetes</strong>. Comença amb <code>&lt;!DOCTYPE&gt;</code>, seguit de <code>&lt;html&gt;</code>, <code>&lt;head&gt;</code> i <code>&lt;body&gt;</code>.</p>
<pre><code>&lt;!doctype html&gt;
&lt;html&gt;
  &lt;head&gt;&lt;/head&gt;
  &lt;body&gt;&lt;/body&gt;
&lt;/html&gt;</code></pre>
